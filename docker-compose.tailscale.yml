services:
  postgres:
    ports: !reset []

  backend:
    environment:
      KEYCLOAK_BACKCHANNEL_BASE_URL: http://keycloak:8080
      KEYCLOAK_CA_BUNDLE: null
    volumes: !reset []
    ports: !reset []

  keycloak:
    environment:
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  edge:
    ports: !override
      - "127.0.0.1:${LOCKDIN_TAILSCALE_EDGE_PORT:-8088}:8080"
    volumes: !override
      - ./infrastructure/Caddyfile.tailscale:/etc/caddy/Caddyfile:ro
